version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - '5000:5000'
    environment:
      DATABASE_URL: 'file:./backend/dev.db'
      JWT_SECRET: 'dev-jwt-secret'
      CLIENT_URL: 'http://localhost:3000'
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: 'http://localhost:5000'
      NEXT_PUBLIC_SOCKET_URL: 'http://localhost:5000'
    volumes:
      - ./frontend:/app
